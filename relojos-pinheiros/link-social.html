<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#101a1b">
	<title>404 — Relógios Pinheiros</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
	<style>
		:root {
			color-scheme: dark;
			--bg: #101a1b;
			--panel: #192526;
			--gold: #d7b875;
			--cream: #f3efe5;
			--muted: #b5c0ba;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 28px 18px;
			background: radial-gradient(ellipse at 50% 0%, #263637 0, var(--bg) 62%);
			color: var(--cream);
			font-family: Arial, Helvetica, sans-serif;
		}

		main {
			width: min(100%, 620px);
			padding: clamp(30px, 7vw, 58px) clamp(22px, 7vw, 64px);
			border: 1px solid rgba(215, 184, 117, .28);
			border-radius: 22px;
			background: linear-gradient(145deg, rgba(31, 45, 45, .97), rgba(20, 31, 32, .98));
			box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
			text-align: center;
		}

		.brand {
			margin: 0 0 28px;
			color: var(--gold);
			font-size: .78rem;
			font-weight: 700;
			letter-spacing: .22em;
			text-transform: uppercase;
		}

		.watch {
			width: 146px;
			height: 146px;
			margin: 0 auto 20px;
			display: grid;
			place-items: center;
			border: 1px solid rgba(215, 184, 117, .24);
			border-radius: 50%;
			background: rgba(0, 0, 0, .14);
		}

		.watch svg { width: 112px; height: 112px; }

		.error-code {
			margin: 0;
			color: var(--gold);
			font-size: clamp(3.2rem, 12vw, 5rem);
			line-height: 1;
			letter-spacing: .08em;
		}

		h1 {
			margin: 16px 0 12px;
			font-size: clamp(1.35rem, 4vw, 1.8rem);
		}

		.message {
			max-width: 440px;
			margin: 0 auto;
			color: var(--muted);
			font-size: 1rem;
			line-height: 1.7;
		}

		.whatsapp {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			margin-top: 30px;
			padding: 14px 22px;
			border-radius: 999px;
			background: #25d366;
			color: #082112;
			font-size: .95rem;
			font-weight: 700;
			text-decoration: none;
			transition: transform .2s ease, background .2s ease;
		}

		.whatsapp:hover { transform: translateY(-2px); background: #40e47b; }
		.whatsapp:focus-visible { outline: 3px solid var(--cream); outline-offset: 4px; }
		.whatsapp svg { width: 20px; height: 20px; fill: currentColor; }

		.note {
			margin: 18px 0 0;
			color: #879691;
			font-size: .78rem;
			line-height: 1.5;
		}
	</style>
</head>
<body>

</body>
</html>
